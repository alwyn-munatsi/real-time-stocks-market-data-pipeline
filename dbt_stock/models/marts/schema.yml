version: 2

models:
  - name: fct_stock_performance
    description: >
      Daily stock performance fact table — consumed directly by Power BI.
      Contains OHLCV, 7-day and 30-day moving averages, daily % change,
      and intraday price range. One row per ticker per trading day.
    columns:
      - name: ticker
        description: "Stock ticker symbol"
        tests:
          - not_null
          - accepted_values:
              values: ['AAPL', 'MSFT', 'GOOGL', 'TSLA', 'NVDA', 'AMZN', 'META', 'JPM']

      - name: trade_date
        description: "Trading date (UTC)"
        tests:
          - not_null

      - name: daily_close
        description: "Closing price for the trading day"
        tests:
          - not_null

      - name: moving_avg_7d
        description: "7-day simple moving average of daily_close"
        tests:
          - not_null

      - name: moving_avg_30d
        description: "30-day simple moving average of daily_close"
        tests:
          - not_null

      - name: daily_pct_change
        description: "Percentage change vs previous trading day close. NULL on first row per ticker."

      - name: _dbt_updated_at
        description: "Timestamp of the last dbt run that populated this row"
        tests:
          - not_null
