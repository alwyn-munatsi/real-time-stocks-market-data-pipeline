version: 2

models:
  - name: stg_stock_prices
    description: "Cleaned and typed stock price ticks — one row per ticker per poll cycle"
    columns:
      - name: ticker
        description: "Stock ticker symbol"
        tests:
          - not_null
          - accepted_values:
              values: ['AAPL', 'MSFT', 'GOOGL', 'TSLA', 'NVDA', 'AMZN', 'META', 'JPM']

      - name: price_timestamp
        description: "UTC timestamp of the price tick"
        tests:
          - not_null

      - name: close_price
        description: "Last traded price — the primary price field for analysis"
        tests:
          - not_null
